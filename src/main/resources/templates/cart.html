<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel = "stylesheet" type = "text/css" href = "/css/style.css">
</head>
<body>
	<header th:replace = "header"></header>
	<main th:classappend="${isPremium} ? ' premium' : ''">
	<h1>カートの中身</h1>
	<table border="1">
				<tr>
					<th>NO</th>
					<th>商品名</th>
					<th>価格</th>
					<th>本数</th>
					<th>小計</th>
					<th></th>
				</tr>
				<tr th:each="drink:${@cart.drink}">
					<td th:text="${drink.drinkId}"></td>
					<td><a th:href = "@{/detail/{drinkId}(drinkId = ${drink.drinkId})}" th:text="${drink.drinkName}"></a></td>
					<td th:text="${drink.price} + 円"></td>
					<td th:text="${drink.quantity} + 本"></td>
					<td th:text="${drink.price * drink.quantity} + 円"></td>
					<td>
						<form action="/cart/delete" method="post">
							<input type="hidden" name="drinkId" th:value="${drink.drinkId}">
							<button>削除</button>
						</form>
					</td>
				</tr>
				<tr>
					<td align="right" colspan="5" th:text="'総数：'+${@cart.totalQuantity} + '本' + '             ' +'総計：'+${@cart.totalPrice}+ '円'"></td>
				</tr>
				<tr>
					<td align="right" colspan="5" th:text= "割引価格： + ${@cart.discountPrice}  + '円'"></td>
					<td></td>
				</tr>
				<tr>
					<td align="right" colspan="5" th:text= "割引後価格： + ${@cart.finalPrice}  + '円'"></td>
					<td></td>
				</tr>
				
			</table>
			
		<h3>お客様情報</h3>
		<form action = "/cart" method = "post">
			<table>
				<tr>
					<th>お名前</th>
					<td><input type="text" name="name" th:value="${@u.name}" readonly /></td>
				</tr>
				<tr>
					<th>メールアドレス</th>
					<td><input type="text" name="email" th:value="${@u.email}"></td>
				</tr>
				<tr>
					<th>住所</th>
					<td><input type="text" name="address" th:value="${@u.address}"></td>
				</tr>	
			</table>
		</form>
		<div style="display: flex; justify-content: center; gap: 12px; margin-top: 20px;">
		  <form action="/drink" method="get">
		    <button type="submit">商品一覧に戻る</button>
		  </form>
		  <form action="/order" method="get">
		    <button type="submit">注文を確定する</button>
		  </form>
		</div>
	</main>
		<footer th:replace = "footer"></footer>

	</body>
</html>
